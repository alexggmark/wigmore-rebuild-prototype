        'right': 'md:justify-end'
      }[slide.alignDesktop] || 'md:justify-center';

            >

            <!-- Overlay - desktop -->
            <div

                    alt=""
                    decoding="async"
                    class="h-auto object-contain mb-2"
                    :style="`width: ${slide.bannerLogoWidth || 150}px`"

                </template>
